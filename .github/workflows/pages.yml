name: Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'lot-*']

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deployer:
    if: github.event_name == 'push'
    needs: verifier
    runs-on: ubuntu-latest
    # un seul déploiement à la fois : main et les branches lot-* partagent le même site
    concurrency:
      group: pages-deploiement
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Préparer la partie statique (racine = main, aperçus = branches lot-*)
        run: |
          copier() {
            ref="$1"; cible="$2"; chemins=""
            mkdir -p "$cible"
            for p in index.html accueil.html attente.html diagnostic.html produit.html panier.html pro.html connexion.html compte.html achats.html achat.html informations.html sav-acces.html sav.html demandes.html comparateur.html css assets data wireframes; do
              if git cat-file -e "$ref:$p" 2>/dev/null; then chemins="$chemins $p"; fi
            done
            git archive "$ref" $chemins | tar -x -C "$cible"
          }
          copier origin/main site
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/lot-*'); do
            nom="${ref#origin/}"
            copier "$ref" "site/$nom"
            # apercu.txt (racine de la branche) : page principale du lot, chemin relatif sûr
            entree="$(git show "$ref:apercu.txt" 2>/dev/null | head -n1 | tr -d '\r' || true)"
            if printf '%s' "$entree" | grep -Eq '^[A-Za-z0-9._/-]+$' && ! printf '%s' "$entree" | grep -q '\.\.'; then
              # la page d'attente du lot devient attente.html ; /lot-N/ redirige vers la page principale
              # (cible index.html : l'accueil est déjà /lot-N/index.html, rien à déplacer ni à rediriger)
              if [ "$entree" = "index.html" ]; then
                continue
              fi
              if [ -f "site/$nom/index.html" ]; then
                mv "site/$nom/index.html" "site/$nom/attente.html"
                grep -rl --include='*.html' '\.\./index\.html' "site/$nom" | xargs -r sed -i 's|\.\./index\.html|../attente.html|g'
              fi
              printf '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=%s"><title>Aperçu du %s</title></head><body><p><a href="%s">Aperçu du %s</a></p></body></html>' "$entree" "$nom" "$entree" "$nom" > "site/$nom/index.html"
            fi
          done
      - name: "Générer la page Lots (tolérant aux pannes, la publication continue en cas d'échec)"
        continue-on-error: true
        run: node scripts/lots/generer.mjs site --git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
