<!doctype html>
<html lang="fr" data-donnees="compte">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mes informations (exemple)</title>
  <meta name="description" content="Démonstrateur : informations personnelles du compte client de démonstration, formulaire simulé. Contenus fictifs, aucune vente.">
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/composants.css">
  <link rel="stylesheet" href="css/accueil.css">
  <link rel="stylesheet" href="css/diagnostic.css">
  <link rel="stylesheet" href="css/produit.css">
  <link rel="stylesheet" href="css/pro.css">
  <link rel="stylesheet" href="css/compte.css">
  <script type="module" src="assets/js/rendu.js"></script>
  <script type="module" src="assets/js/menu.js"></script>
  <script type="module" src="assets/js/compteur.js"></script>
  <script type="module" src="assets/js/compte-lien.js"></script>
  <script type="module" src="assets/js/informations.js"></script>
</head>
<body>
  <div class="relief" aria-hidden="true">
    <svg class="relief__groupe relief__groupe--1" viewBox="-190 -150 380 300" focusable="false" fill="none" stroke="currentColor" stroke-width="1">
      <defs><path id="relief-blob" vector-effect="non-scaling-stroke" d="M-120 0C-125 -62 -45 -92 25 -82C105 -72 135 -12 112 42C90 94 22 104 -42 88C-100 72 -116 38 -120 0Z"/></defs>
      <use href="#relief-blob" transform="scale(0.25)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.5)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.75)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.25)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.5)" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="relief__groupe relief__groupe--2" viewBox="-170 -170 340 340" focusable="false" fill="none" stroke="currentColor" stroke-width="1">
      <g transform="rotate(30)">
      <use href="#relief-blob" transform="scale(0.2)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.45)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.7)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.95)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.2)" vector-effect="non-scaling-stroke"/>
      </g>
    </svg>
  </div>
  <noscript><p class="noscript">Ce démonstrateur nécessite JavaScript</p></noscript>
  <a class="lien-evitement" href="#contenu" data-texte="site.evitement"></a>
  <aside class="bandeau-demo" data-aria-label="site.aria.bandeau">
    <p class="conteneur" data-texte="site.bandeau"></p>
  </aside>
    <header class="entete" data-bloc="E12-1" data-role="en-tete">
    <div class="conteneur entete__ligne">
      <a class="marque" data-lien="site.liens.accueil">
        <svg class="marque__pictogramme" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path class="marque__toit" d="M4 15 16 5l12 10"/>
          <path class="marque__goutte" d="M16 13c0 0 6 6 6 10a6 6 0 0 1-12 0c0-4 6-10 6-10z"/>
        </svg>
        <span data-texte="site.nom"></span>
      </a>
      <a class="lien-entete entete__panier-barre" data-lien="site.liens.panier">
        <svg class="pictogramme" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
        <span data-texte="site.navigation.panier"></span>
      </a>
      <button type="button" class="bouton bouton--discret entete__menu" data-menu-bouton aria-expanded="false" aria-controls="menu-navigation" data-texte="site.navigation.menu"></button>
      <nav class="nav" id="menu-navigation" data-aria-label="site.aria.navigation">
        <ul>
          <li><a class="nav__lien" data-lien="site.liens.pro" data-texte="site.navigation.pro"></a></li>
          <li><a class="nav__lien" data-lien="site.liens.connexion" data-texte="site.navigation.compte"></a></li>
          <li class="nav__panier">
            <a class="lien-entete" data-lien="site.liens.panier">
              <svg class="pictogramme" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
              <span data-texte="site.navigation.panier"></span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <nav class="nav-compte" data-aria-label="compte.navigationCompte.aria">
    <div class="conteneur">
      <ul class="nav-compte__liste">
        <li><a class="nav-compte__lien" data-lien="site.liens.compte" data-texte="compte.navigationCompte.tableauDeBord"></a></li>
        <li><a class="nav-compte__lien" data-lien="site.liens.achats" data-texte="compte.navigationCompte.achats"></a></li>
        <li><a class="nav-compte__lien" data-lien="site.liens.demandes" data-texte="compte.navigationCompte.demandes"></a></li>
        <li><a class="nav-compte__lien" data-lien="site.liens.informations" aria-current="page"><span data-texte="compte.navigationCompte.informations"></span> <span class="visuellement-cache" data-texte="compte.navigationCompte.pageActuelle"></span></a></li>
        <li><button type="button" class="bouton bouton--secondaire nav-compte__deconnexion" data-deconnexion data-texte="compte.navigationCompte.deconnexion"></button></li>
      </ul>
    </div>
  </nav>
  <main id="contenu" class="compte compte--informations" tabindex="-1">
    <div class="conteneur compte__bloc compte__informations">
      <div class="carte compte__carte-info">
        <form class="formulaire" novalidate hidden aria-labelledby="titre-identite">
          <section class="compte__section" data-bloc="E12-2" data-role="identite" aria-labelledby="titre-identite">
            <h1 id="titre-identite" data-texte="compte.pages.informations.titre"></h1>
            <p class="formulaire__demo" data-texte="compte.formulaire.demo"></p>
            <p class="compte__enregistre" role="status" tabindex="-1" data-enregistre data-texte="compte.pages.informations.confirmation" hidden></p>
            <div class="formulaire__resume" role="alert" tabindex="-1" data-resume hidden>
              <p class="formulaire__resume-titre" data-resume-titre></p>
              <ul class="formulaire__resume-liste" data-resume-liste></ul>
              <template data-resume-modele><li><a class="formulaire__lien" href="#"></a></li></template>
            </div>
            <div class="formulaire__grille">
            <div class="formulaire__champ">
              <label class="etiquette" for="prenom" data-texte="compte.pages.informations.champs.prenom"></label>
              <input class="champ" type="text" id="prenom" autocomplete="given-name" aria-describedby="erreur-prenom">
              <p class="formulaire__erreur" id="erreur-prenom" hidden></p>
            </div>
            <div class="formulaire__champ">
              <label class="etiquette" for="nom" data-texte="compte.pages.informations.champs.nom"></label>
              <input class="champ" type="text" id="nom" autocomplete="family-name" aria-describedby="erreur-nom">
              <p class="formulaire__erreur" id="erreur-nom" hidden></p>
            </div>
            <div class="formulaire__champ">
              <label class="etiquette" for="email" data-texte="compte.pages.informations.champs.email"></label>
              <input class="champ" type="email" id="email" autocomplete="email" aria-describedby="erreur-email">
              <p class="formulaire__erreur" id="erreur-email" hidden></p>
            </div>
            <div class="formulaire__champ">
              <label class="etiquette" for="telephone" data-texte="compte.pages.informations.champs.telephone"></label>
              <input class="champ" type="tel" id="telephone" autocomplete="tel" aria-describedby="erreur-telephone">
              <p class="formulaire__erreur" id="erreur-telephone" hidden></p>
            </div>
            </div>
          </section>
          <section class="compte__section" data-bloc="E12-3" data-role="adresse" aria-labelledby="titre-adresse">
            <h2 id="titre-adresse" data-texte="compte.pages.informations.adresse"></h2>
            <div class="formulaire__grille">
            <div class="formulaire__champ formulaire__champ--pleine">
              <label class="etiquette" for="adresse" data-texte="compte.pages.informations.champs.adresse"></label>
              <input class="champ" type="text" id="adresse" autocomplete="street-address" aria-describedby="erreur-adresse">
              <p class="formulaire__erreur" id="erreur-adresse" hidden></p>
            </div>
            <div class="formulaire__champ formulaire__champ--pleine">
              <label class="etiquette" for="complement" data-texte="compte.pages.informations.champs.complement"></label>
              <input class="champ" type="text" id="complement" autocomplete="address-line2" aria-describedby="erreur-complement">
              <p class="formulaire__erreur" id="erreur-complement" hidden></p>
            </div>
            <div class="formulaire__champ">
              <label class="etiquette" for="code-postal" data-texte="compte.pages.informations.champs.codePostal"></label>
              <input class="champ" type="text" id="code-postal" autocomplete="postal-code" inputmode="numeric" aria-describedby="erreur-code-postal">
              <p class="formulaire__erreur" id="erreur-code-postal" hidden></p>
            </div>
            <div class="formulaire__champ">
              <label class="etiquette" for="ville" data-texte="compte.pages.informations.champs.ville"></label>
              <input class="champ" type="text" id="ville" autocomplete="address-level2" aria-describedby="erreur-ville">
              <p class="formulaire__erreur" id="erreur-ville" hidden></p>
            </div>
            </div>
          </section>
          <section class="compte__section" data-bloc="E12-4" data-role="preferences" aria-labelledby="titre-preferences">
            <h2 id="titre-preferences" data-texte="compte.pages.informations.preferences"></h2>
            <fieldset class="formulaire__groupe">
              <legend class="etiquette" data-texte="compte.pages.informations.prefs.legende"></legend>
              <div class="formulaire__cases">
                <label class="formulaire__case" for="pref-suivi"><input type="checkbox" id="pref-suivi"><span data-texte="compte.pages.informations.prefs.suiviCommandes"></span></label>
                <label class="formulaire__case" for="pref-sav"><input type="checkbox" id="pref-sav"><span data-texte="compte.pages.informations.prefs.infosSav"></span></label>
              </div>
            </fieldset>
            <p class="compte__rgpd" data-texte="compte.pages.informations.rgpd"></p>
            <button type="submit" class="bouton bouton--action formulaire__bouton" data-texte="compte.pages.informations.bouton"></button>
            <p class="formulaire__demo" data-texte="compte.formulaire.demo"></p>
          </section>
        </form>
      </div>
    </div>
  </main>
  <footer class="pied" data-bloc="E12-5" data-role="pied">
    <div class="conteneur">
      <div class="pied__grille" aria-busy="true">
        <template data-liste="site.pied.colonnes">
          <div class="pied__colonne">
            <h2 class="pied__titre" data-texte="titre"></h2>
            <ul class="pied__liste">
              <template data-liste="entrees">
                <li><a class="pied__lien" data-lien-element="lien" data-texte="texte"></a></li>
              </template>
            </ul>
          </div>
        </template>
        <div class="pied__colonne pied__marque">
          <p class="pied__nom" data-texte="site.nom"></p>
          <p class="pied__presentation" data-texte="site.pied.presentation"></p>
        </div>
      </div>
      <p class="pied__bas" data-texte="site.bandeau"></p>
    </div>
  </footer>
</body>
</html>
