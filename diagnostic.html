<!doctype html>
<html lang="fr" data-donnees="diagnostic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Diagnostic de votre exposition : équipements, niveau et carte d'exemple</title>
  <meta name="description" content="Démonstrateur : diagnostic d'exposition d'une maison, équipements recommandés, niveau et carte schématique d'exemple. Contenus fictifs, aucune vente.">
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/composants.css">
  <link rel="stylesheet" href="css/accueil.css">
  <link rel="stylesheet" href="css/diagnostic.css">
  <script type="module" src="assets/js/rendu.js"></script>
  <script type="module" src="assets/js/menu.js"></script>
  <script type="module" src="assets/js/diagnostic.js"></script>
</head>
<body>
  <div class="relief" aria-hidden="true">
    <svg class="relief__groupe relief__groupe--1" viewBox="-190 -150 380 300" focusable="false" fill="none" stroke="currentColor" stroke-width="1">
      <defs><path id="relief-blob" vector-effect="non-scaling-stroke" d="M-120 0C-125 -62 -45 -92 25 -82C105 -72 135 -12 112 42C90 94 22 104 -42 88C-100 72 -116 38 -120 0Z"/></defs>
      <use href="#relief-blob" transform="scale(0.25)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.5)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.75)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.25)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.5)" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="relief__groupe relief__groupe--2" viewBox="-170 -170 340 340" focusable="false" fill="none" stroke="currentColor" stroke-width="1">
      <g transform="rotate(30)">
      <use href="#relief-blob" transform="scale(0.2)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.45)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.7)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.95)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.2)" vector-effect="non-scaling-stroke"/>
      </g>
    </svg>
  </div>
  <noscript><p class="noscript">Ce démonstrateur nécessite JavaScript</p></noscript>
  <a class="lien-evitement" href="#contenu" data-texte="site.evitement"></a>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="inondation" viewBox="0 0 48 48"><path d="M9 23 24 9l15 14M13 20v10M35 20v10"/><path d="M5 36q4.5-4 9 0t9 0t9 0t9 0t4 0M5 43q4.5-4 9 0t9 0t9 0t9 0t4 0"/></symbol>
    <symbol id="grele-vent" viewBox="0 0 48 48"><path d="M14 28a6 6 0 0 1 0-12 9 9 0 0 1 17-1 6 6 0 0 1 2 13z"/><circle cx="15" cy="37" r="1.8"/><circle cx="25" cy="42" r="1.8"/><circle cx="35" cy="37" r="1.8"/></symbol>
    <symbol id="feu" viewBox="0 0 48 48"><path d="M24 6c2 7 11 11 11 22a11 11 0 0 1-22 0c0-5 3-8 5-10 0 4 2 6 4 6 0-6-1-11 2-18z"/><path d="M24 42a5 5 0 0 1-5-5c0-3 2-5 5-8 3 3 5 5 5 8a5 5 0 0 1-5 5z"/></symbol>
    <symbol id="chaleur" viewBox="0 0 48 48"><circle cx="24" cy="24" r="8"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2"/></symbol>
    <symbol id="froid" viewBox="0 0 48 48"><path d="M24 6v36M8.4 15l31.2 18M8.4 33l31.2-18M19 9l5 4 5-4M19 39l5-4 5 4"/></symbol>
    <symbol id="bouclier" viewBox="0 0 48 48"><path d="M24 5 9 11v11c0 10 6 17 15 21 9-4 15-11 15-21V11z"/><path d="m17 24 5 5 9-10"/></symbol>
    <symbol id="chute" viewBox="0 0 48 48"><path d="M24 8v26M14 24l10 10 10-10M10 41h28"/></symbol>
  </svg>
  <aside class="bandeau-demo" data-aria-label="site.aria.bandeau">
    <p class="conteneur" data-texte="site.bandeau"></p>
  </aside>
  <header class="entete" data-bloc="E2-1" data-role="en-tete">
    <div class="conteneur entete__ligne">
      <a class="marque" data-lien="site.liens.accueil">
        <svg class="marque__pictogramme" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path class="marque__toit" d="M4 15 16 5l12 10"/>
          <path class="marque__goutte" d="M16 13c0 0 6 6 6 10a6 6 0 0 1-12 0c0-4 6-10 6-10z"/>
        </svg>
        <span data-texte="site.nom"></span>
      </a>
      <a class="lien-entete entete__panier-barre" data-lien="site.liens.panier">
        <svg class="pictogramme" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
        <span data-texte="site.navigation.panier"></span>
      </a>
      <button type="button" class="bouton bouton--discret entete__menu" data-menu-bouton aria-expanded="false" aria-controls="menu-navigation" data-texte="site.navigation.menu"></button>
      <nav class="nav" id="menu-navigation" data-aria-label="site.aria.navigation">
        <ul>
          <li><a class="nav__lien" data-lien="site.liens.pro" data-texte="site.navigation.pro"></a></li>
          <li><a class="nav__lien" data-lien="site.liens.connexion" data-texte="site.navigation.compte"></a></li>
          <li class="nav__panier">
            <a class="lien-entete" data-lien="site.liens.panier">
              <svg class="pictogramme" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
              <span data-texte="site.navigation.panier"></span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="contenu" tabindex="-1">
    <div class="conteneur diag">
      <section class="diag__bloc diag__adresse" data-bloc="E2-2" data-role="adresse" aria-labelledby="titre-adresse">
        <h1 id="titre-adresse" data-texte="diagnostic.textes.titre"></h1>
        <p class="diag__aide" id="adresse-aide" data-texte="diagnostic.textes.aide"></p>
        <div class="diag__panneau carte">
          <form class="diag__formulaire" id="formulaire-adresse" novalidate>
            <label class="etiquette" for="adresse-evaluee" data-texte="diagnostic.textes.champLibelle"></label>
            <div class="diag__ligne">
              <input class="champ" type="text" id="adresse-evaluee" name="adresse" autocomplete="street-address" aria-describedby="adresse-aide adresse-erreur" data-placeholder="diagnostic.textes.placeholder">
              <button type="submit" class="bouton bouton--secondaire" data-texte="diagnostic.textes.bouton"></button>
            </div>
            <p class="recherche__erreur" id="adresse-erreur" aria-live="polite"></p>
          </form>
          <fieldset class="diag__alea" id="choix-alea">
            <legend data-texte="diagnostic.textes.legendeAlea"></legend>
            <div class="diag__pastilles" id="pastilles-alea">
              <template id="modele-pastille">
                <label class="pastille-choix"><input type="radio" name="alea"><span></span></label>
              </template>
            </div>
          </fieldset>
          <p class="diag__mention" data-texte="diagnostic.textes.mention"></p>
        </div>
      </section>
      <section class="diag__bloc diag__equipements" data-bloc="E2-3" data-role="equipements" aria-labelledby="titre-equipements">
        <h2 id="titre-equipements" data-texte="diagnostic.textes.equipements.titre"></h2>
        <p class="diag__intro" data-texte="diagnostic.textes.equipements.intro"></p>
        <ul class="equipements" id="liste-equipements" aria-busy="true">
          <template id="modele-equipement">
            <li class="equipement carte">
              <div class="equipement__visuel" aria-hidden="true"><svg class="icone" viewBox="0 0 48 48" focusable="false"><use></use></svg></div>
              <div class="equipement__corps">
                <h3></h3>
                <p class="equipement__ligne"><span class="equipement__etiquette"></span> <span class="equipement__alea"></span></p>
                <p class="equipement__ligne"><span class="equipement__etiquette"></span> <span class="equipement__prix"></span> <span class="equipement__exemple"></span></p>
                <a class="bouton bouton--secondaire"></a>
              </div>
            </li>
          </template>
        </ul>
        <p class="visuellement-cache" id="annonce-diagnostic" role="status" aria-live="polite"></p>
      </section>
      <section class="diag__bloc diag__score" data-bloc="E2-4" data-role="score" aria-labelledby="titre-score">
        <h2 id="titre-score" data-texte="diagnostic.textes.score.titre"></h2>
        <div class="score carte" aria-busy="true">
          <ol class="jauge" id="jauge" aria-hidden="true"></ol>
          <p class="score__niveau" id="score-niveau"></p>
          <p class="score__phrase" id="score-phrase"></p>
          <p class="diag__mention" data-texte="diagnostic.textes.score.mention"></p>
        </div>
      </section>
      <section class="diag__bloc diag__carte" data-bloc="E2-5" data-role="carte" aria-labelledby="titre-carte">
        <h2 id="titre-carte" data-texte="diagnostic.textes.carte.titre"></h2>
      </section>
    </div>
  </main>
  <footer class="pied" data-bloc="E2-6" data-role="pied">
    <div class="conteneur">
      <div class="pied__grille" aria-busy="true">
        <template data-liste="site.pied.colonnes">
          <div class="pied__colonne">
            <h2 class="pied__titre" data-texte="titre"></h2>
            <ul class="pied__liste">
              <template data-liste="entrees">
                <li><a class="pied__lien" data-lien-element="lien" data-texte="texte"></a></li>
              </template>
            </ul>
          </div>
        </template>
        <div class="pied__colonne pied__marque">
          <p class="pied__nom" data-texte="site.nom"></p>
          <p class="pied__presentation" data-texte="site.pied.presentation"></p>
        </div>
      </div>
      <p class="pied__bas" data-texte="site.bandeau"></p>
    </div>
  </footer>
</body>
</html>
