<!doctype html>
<html lang="fr" data-donnees="produit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fiche produit : achat, mode de commande et configurateur de cotes (exemple)</title>
  <meta name="description" content="Démonstrateur : fiche produit d'un équipement de protection de l'habitat, galerie, prix, délai, choix du mode de commande et configurateur de cotes. Contenus fictifs, aucune vente.">
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/composants.css">
  <link rel="stylesheet" href="css/accueil.css">
  <link rel="stylesheet" href="css/diagnostic.css">
  <link rel="stylesheet" href="css/produit.css">
  <script type="module" src="assets/js/rendu.js"></script>
  <script type="module" src="assets/js/menu.js"></script>
  <script type="module" src="assets/js/produit.js"></script>
</head>
<body>
  <div class="relief" aria-hidden="true">
    <svg class="relief__groupe relief__groupe--1" viewBox="-190 -150 380 300" focusable="false" fill="none" stroke="currentColor" stroke-width="1">

      <use href="#relief-blob" transform="scale(0.25)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.5)" vector-effect="non-scaling-stroke"/>

      <use href="#relief-blob" transform="scale(1)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.25)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.5)" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="relief__groupe relief__groupe--2" viewBox="-170 -170 340 340" focusable="false" fill="none" stroke="currentColor" stroke-width="1">
      <g transform="rotate(30)">
      <use href="#relief-blob" transform="scale(0.2)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.45)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.7)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(0.95)" vector-effect="non-scaling-stroke"/>
      <use href="#relief-blob" transform="scale(1.2)" vector-effect="non-scaling-stroke"/>
      </g>
    </svg>
  </div>
  <noscript><p class="noscript">Ce démonstrateur nécessite JavaScript</p></noscript>
  <a class="lien-evitement" href="#contenu" data-texte="site.evitement"></a>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="pression" viewBox="0 0 48 48"><path d="M8 40h32M8 8v32"/><path d="M8 28q6-4 12 0t12 0t8 0"/><path d="M8 18q6-4 12 0t12 0t8 0"/><path d="M24 8v6M20 11l4 4 4-4"/></symbol>
    <symbol id="chrono" viewBox="0 0 48 48"><circle cx="24" cy="27" r="14"/><path d="M24 27V17M20 7h8M24 7v6M36 13l3-3"/></symbol>
    <symbol id="anticorrosion" viewBox="0 0 48 48"><path d="M24 5 9 11v11c0 10 6 17 15 21 9-4 15-11 15-21V11z"/><path d="M24 16v14M17 23h14"/></symbol>
    <symbol id="conformite" viewBox="0 0 48 48"><rect x="10" y="6" width="28" height="36" rx="3"/><path d="M17 16h14M17 23h14M17 30h6"/><path d="m27 34 3 3 6-7"/></symbol>
    <symbol id="telecharger" viewBox="0 0 48 48"><path d="M24 8v24M14 22l10 10 10-10M10 41h28"/></symbol>
  </svg>
  <aside class="bandeau-demo" data-aria-label="site.aria.bandeau">
    <p class="conteneur" data-texte="site.bandeau"></p>
  </aside>
  <header class="entete" data-bloc="E3-1" data-role="en-tete">
    <div class="conteneur entete__ligne">
      <a class="marque" data-lien="site.liens.accueil">
        <svg class="marque__pictogramme" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path class="marque__toit" d="M4 15 16 5l12 10"/>
          <path class="marque__goutte" d="M16 13c0 0 6 6 6 10a6 6 0 0 1-12 0c0-4 6-10 6-10z"/>
        </svg>
        <span data-texte="site.nom"></span>
      </a>
      <a class="lien-entete entete__panier-barre" data-lien="site.liens.panier">
        <svg class="pictogramme" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
        <span data-texte="site.navigation.panier"></span>
      </a>
      <button type="button" class="bouton bouton--discret entete__menu" data-menu-bouton aria-expanded="false" aria-controls="menu-navigation" data-texte="site.navigation.menu"></button>
      <nav class="nav" id="menu-navigation" data-aria-label="site.aria.navigation">
        <ul>
          <li><a class="nav__lien" data-lien="site.liens.pro" data-texte="site.navigation.pro"></a></li>
          <li><a class="nav__lien" data-lien="site.liens.connexion" data-texte="site.navigation.compte"></a></li>
          <li class="nav__panier">
            <a class="lien-entete" data-lien="site.liens.panier">
              <svg class="pictogramme" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
              <span data-texte="site.navigation.panier"></span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="contenu" tabindex="-1">
    <nav class="fil" data-aria-label="produit.textes.fil.aria">
      <div class="conteneur">
        <ol class="fil__liste">
          <li><a class="fil__lien" data-lien="site.liens.accueil" data-texte="produit.textes.fil.accueil"></a></li>
          <li><a class="fil__lien" data-lien="site.liens.diagnostic" data-texte="produit.textes.fil.diagnostic"></a></li>
          <li class="fil__courant" aria-current="page" id="fil-produit"></li>
        </ol>
      </div>
    </nav>
    <div class="conteneur produit">
      <section class="produit__bloc produit__galerie" data-bloc="E3-2" data-role="galerie" aria-labelledby="titre-galerie">
        <h2 class="visuellement-cache" id="titre-galerie" data-texte="produit.textes.galerie.titre"></h2>
        <div class="galerie" aria-busy="true">
          <figure class="galerie__panneau" id="galerie-panneau" data-type="image" aria-live="polite">
            <div class="galerie__visuel">
              <span class="galerie__libelle" data-texte="produit.textes.galerie.placeholder"></span>
              <span class="galerie__video" aria-hidden="true"></span>
            </div>
            <figcaption class="galerie__legende" id="galerie-legende"></figcaption>
          </figure>
          <fieldset class="galerie__vues">
            <legend class="visuellement-cache" data-texte="produit.textes.galerie.legendeVues"></legend>
            <ul class="galerie__liste" aria-busy="true">
              <template data-liste="galerie.vues">
                <li class="vignette">
                  <label class="vignette__choix"><input class="vignette__radio" type="radio" name="vue"><span class="vignette__court" data-texte="court"></span></label>
                </li>
              </template>
            </ul>
          </fieldset>
        </div>
      </section>
      <section class="produit__bloc produit__achat" data-bloc="E3-3" data-role="achat" aria-labelledby="titre-achat">
        <h1 id="titre-achat"></h1>
        <div class="achat" aria-busy="true">
          <p class="achat__mention" data-texte="produit.textes.achat.mention"></p>
          <p class="achat__ligne"><span data-texte="produit.textes.achat.reference"></span> <span id="achat-reference"></span> <span class="achat__exemple" data-texte="produit.textes.achat.exemple"></span></p>
          <p class="achat__ligne"><span class="achat__etiquette" data-texte="produit.textes.achat.prix"></span> <strong class="achat__prix" id="achat-prix"></strong></p>
          <p class="achat__ligne"><span class="achat__etiquette" data-texte="produit.textes.achat.livraison"></span> <span id="achat-delai"></span> <span class="achat__exemple" data-texte="produit.textes.achat.exemple"></span></p>
          <ul class="pastilles achat__pastilles" aria-busy="true">
            <template data-liste="badges">
              <li class="pastille" data-texte="titre"></li>
            </template>
          </ul>
        </div>
      </section>
      <section class="produit__bloc produit__mode" data-bloc="E3-4" data-role="mode" aria-labelledby="titre-mode">
        <h2 id="titre-mode" data-texte="produit.textes.mode.titre"></h2>
        <div class="mode" aria-busy="true">
          <fieldset class="mode__choix">
            <legend class="mode__legende" data-texte="produit.textes.mode.legende"></legend>
            <div class="mode__options">
              <label class="mode__option">
                <input class="mode__radio" type="radio" name="mode" value="diy">
                <span class="mode__titre" data-texte="produit.modes.diy.titre"></span>
                <span class="mode__aide" data-texte="produit.modes.diy.aide"></span>
              </label>
              <label class="mode__option">
                <input class="mode__radio" type="radio" name="mode" value="pose">
                <span class="mode__titre" data-texte="produit.modes.pose.titre"></span>
                <span class="mode__aide" data-texte="produit.modes.pose.aide"></span>
              </label>
            </div>
          </fieldset>
          <div class="mode__detail" id="mode-detail" aria-live="polite"></div>
          <dl class="mode__prix" id="mode-prix" data-aria-label="produit.textes.mode.recapitulatif"></dl>
          <p class="mode__mention" data-texte="produit.textes.mode.mention"></p>
        </div>
      </section>
    </div>
    <section class="conteneur configurateur" data-bloc="E3-5" data-role="configurateur" aria-labelledby="titre-configurateur">
      <h2 id="titre-configurateur" data-texte="produit.configurateur.titre"></h2>
      <div class="configurateur__outil" aria-busy="true">
        <p class="configurateur__intro" data-texte="produit.configurateur.intro"></p>
        <div class="configurateur__grille">
          <div class="configurateur__gauche">
            <div class="configurateur__schema" id="cotes-schema">
              <svg class="schema" viewBox="0 0 400 300" role="img" aria-labelledby="schema-titre schema-desc" focusable="false">
                <title id="schema-titre" data-texte="produit.configurateur.schema.title"></title>
                <desc id="schema-desc" data-texte="produit.configurateur.schema.desc"></desc>
                <defs>
                  <pattern id="schema-hachure" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <line class="schema__hachure" x1="0" y1="0" x2="0" y2="10"/>
                  </pattern>
                </defs>
                <rect class="schema__mur" x="0" y="0" width="400" height="300"/>
                <rect x="0" y="0" width="400" height="300" fill="url(#schema-hachure)"/>
                <rect class="schema__ouverture" x="80" y="50" width="240" height="220"/>
                <rect class="schema__barriere" x="80" y="160" width="240" height="110"/>
                <rect class="schema__seuil" x="64" y="270" width="272" height="16"/>
                <g id="cote-c" class="schema__cote">
                  <rect class="schema__bande" x="48" y="80" width="32" height="50"/>
                  <rect class="schema__bande" x="320" y="80" width="32" height="50"/>
                  <circle class="schema__pastille" cx="64" cy="105" r="14"/>
                  <text class="schema__lettre" x="64" y="105" data-texte="produit.configurateur.schema.lettres.c"></text>
                </g>
                <g id="cote-a" class="schema__cote">
                  <path class="schema__fleche" d="M80 105H320M80 90v30M320 90v30"/>
                  <path class="schema__pointe" d="M80 105l12-6v12zM320 105l-12-6v12z"/>
                  <circle class="schema__pastille" cx="200" cy="105" r="14"/>
                  <text class="schema__lettre" x="200" y="105" data-texte="produit.configurateur.schema.lettres.a"></text>
                </g>
                <g id="cote-b" class="schema__cote">
                  <path class="schema__fleche" d="M120 160V270"/>
                  <path class="schema__pointe" d="M120 160l-6 12h12zM120 270l-6-12h12z"/>
                  <circle class="schema__pastille" cx="120" cy="215" r="14"/>
                  <text class="schema__lettre" x="120" y="215" data-texte="produit.configurateur.schema.lettres.b"></text>
                </g>
              </svg>
            </div>
            <h3 class="configurateur__sous-titre" id="titre-etapes" data-texte="produit.configurateur.etapesTitre"></h3>
            <ol class="etapes" aria-labelledby="titre-etapes" aria-busy="true">
              <template data-liste="configurateur.etapes">
                <li class="etapes__item"><span class="etapes__lettre" data-texte="lettre"></span><span class="etapes__texte" data-texte="texte"></span></li>
              </template>
            </ol>
          </div>
          <div class="configurateur__droite">
            <fieldset class="saisie" id="cotes-saisie">
              <legend class="saisie__legende" data-texte="produit.configurateur.saisie.legende"></legend>
              <div class="cote" data-cote="largeur">
                <label class="etiquette cote__etiquette" for="cote-largeur" data-texte="produit.configurateur.saisie.champs.largeur.libelle"></label>
                <input class="champ cote__champ" id="cote-largeur" type="text" inputmode="numeric" autocomplete="off" aria-describedby="aide-largeur erreur-largeur">
                <p class="cote__aide" id="aide-largeur" data-texte="produit.configurateur.saisie.champs.largeur.aide"></p>
                <p class="cote__erreur" id="erreur-largeur"></p>
              </div>
              <div class="cote" data-cote="hauteur">
                <label class="etiquette cote__etiquette" for="cote-hauteur" data-texte="produit.configurateur.saisie.champs.hauteur.libelle"></label>
                <input class="champ cote__champ" id="cote-hauteur" type="text" inputmode="numeric" autocomplete="off" aria-describedby="aide-hauteur erreur-hauteur">
                <p class="cote__aide" id="aide-hauteur" data-texte="produit.configurateur.saisie.champs.hauteur.aide"></p>
                <p class="cote__erreur" id="erreur-hauteur"></p>
              </div>
              <div class="cote" data-cote="tolerance">
                <label class="etiquette cote__etiquette" for="cote-tolerance" data-texte="produit.configurateur.saisie.champs.tolerance.libelle"></label>
                <input class="champ cote__champ" id="cote-tolerance" type="text" inputmode="numeric" autocomplete="off" aria-describedby="aide-tolerance erreur-tolerance">
                <p class="cote__aide" id="aide-tolerance" data-texte="produit.configurateur.saisie.champs.tolerance.aide"></p>
                <p class="cote__erreur" id="erreur-tolerance"></p>
              </div>
              <div class="plage">
                <p class="plage__libelle"><span data-texte="produit.configurateur.saisie.plage.libelle"></span> <span class="plage__exemple" data-texte="produit.configurateur.saisie.plage.exemple"></span></p>
                <ul class="plage__liste">
                  <li id="plage-largeur"></li>
                  <li id="plage-hauteur"></li>
                </ul>
              </div>
            </fieldset>
            <div class="faisabilite" id="cotes-faisabilite" role="status" aria-live="polite" data-etat="saisir">
              <svg class="faisabilite__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle class="faisabilite__rond" cx="12" cy="12" r="10"/>
                <path class="faisabilite__glyphe faisabilite__glyphe--saisir" d="M7.5 12h.01M12 12h.01M16.5 12h.01"/>
                <path class="faisabilite__glyphe faisabilite__glyphe--compatible" d="m7.5 12.5 3 3 6-7"/>
                <path class="faisabilite__glyphe faisabilite__glyphe--hors" d="M12 7v6.5M12 16.5v.01"/>
              </svg>
              <div class="faisabilite__corps">
                <p class="faisabilite__titre" id="faisabilite-titre"></p>
                <p class="faisabilite__texte" id="faisabilite-texte"></p>
                <ul class="faisabilite__ecarts" id="faisabilite-ecarts"></ul>
                <p class="faisabilite__indisponible" id="faisabilite-indisponible"></p>
              </div>
            </div>
            <div class="action" id="cotes-action">
              <button type="button" class="bouton bouton--secondaire action__bouton" id="cotes-ajouter" aria-disabled="true" aria-describedby="cotes-ajouter-aide" data-texte="produit.configurateur.action.bouton"></button>
              <p class="action__aide" id="cotes-ajouter-aide" data-texte="produit.configurateur.action.aide"></p>
            </div>
          </div>
        </div>
      </div>
      <div class="configurateur__indisponible" hidden>
        <p class="configurateur__message" data-texte="produit.configurateur.nonComplet.message"></p>
        <a class="configurateur__retour" data-lien="site.liens.diagnostic" data-texte="produit.configurateur.nonComplet.lien"></a>
      </div>
    </section>
    <section class="conteneur specs" data-bloc="E3-6" data-role="specs" aria-labelledby="titre-specs">
      <h2 id="titre-specs" data-texte="produit.specifications.titre"></h2>
      <p class="specs__intro" data-texte="produit.specifications.introduction"></p>
      <div class="specs__tableau"></div>
      <p class="specs__note" data-texte="produit.specifications.note"></p>
    </section>
    <section class="conteneur documents" data-bloc="E3-7" data-role="documents" aria-labelledby="titre-documents">
      <h2 id="titre-documents" data-texte="produit.documentsTextes.titre"></h2>
      <p class="documents__intro" data-texte="produit.documentsTextes.introduction"></p>
      <ul class="documents__liste"></ul>
      <p class="documents__mention" data-texte="produit.documentsTextes.mention"></p>
    </section>
  </main>
  <footer class="pied" data-bloc="E3-8" data-role="pied">
    <div class="conteneur">
      <div class="pied__grille" aria-busy="true">
        <template data-liste="site.pied.colonnes">
          <div class="pied__colonne">
            <h2 class="pied__titre" data-texte="titre"></h2>
            <ul class="pied__liste">
              <template data-liste="entrees">
                <li><a class="pied__lien" data-lien-element="lien" data-texte="texte"></a></li>
              </template>
            </ul>
          </div>
        </template>
        <div class="pied__colonne pied__marque">
          <p class="pied__nom" data-texte="site.nom"></p>
          <p class="pied__presentation" data-texte="site.pied.presentation"></p>
        </div>
      </div>
      <p class="pied__bas" data-texte="site.bandeau"></p>
    </div>
  </footer>
</body>
</html>
