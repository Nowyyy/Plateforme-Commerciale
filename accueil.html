<!doctype html>
<html lang="fr">
<head>

  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">

<body>
  <noscript><p class="noscript">Ce démonstrateur nécessite JavaScript</p></noscript>
  <a class="lien-evitement" href="#contenu" data-texte="site.evitement"></a>
  <aside class="bandeau-demo" data-aria-label="site.aria.bandeau">
    <p class="conteneur" data-texte="site.bandeau"></p>
  </aside>
  <header class="entete" data-bloc="E1-1">
    <div class="conteneur entete__ligne">
      <a class="marque" data-lien="site.liens.accueil">
        <svg class="marque__pictogramme" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path class="marque__toit" d="M4 15 16 5l12 10"/>
          <path class="marque__goutte" d="M16 13c0 0 6 6 6 10a6 6 0 0 1-12 0c0-4 6-10 6-10z"/>
        </svg>
        <span data-texte="site.nom"></span>
      </a>
      <a class="lien-entete entete__panier-barre" data-lien="site.liens.panier">
        <svg class="pictogramme" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
        <span data-texte="site.navigation.panier"></span>
      </a>
      <button type="button" class="bouton bouton--discret entete__menu" data-menu-bouton aria-expanded="false" aria-controls="menu-navigation" data-texte="site.navigation.menu"></button>
      <nav class="nav" id="menu-navigation" data-aria-label="site.aria.navigation">
        <ul>
          <li data-texte="site.navigation.aleas"></li>
          <li data-texte="site.navigation.fonctionnement"></li>
          <li class="nav__panier">
            <a class="lien-entete" data-lien="site.liens.panier">
              <svg class="pictogramme" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
              <span data-texte="site.navigation.panier"></span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="contenu" tabindex="-1">
    <section class="avis" data-bloc="E1-2" data-aria-label="accueil.avis.aria">
      <div class="conteneur avis__ligne">
        <p class="avis__etoiles" aria-hidden="true"><span class="avis__carre"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span><span class="avis__carre"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span><span class="avis__carre"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span><span class="avis__carre"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span><span class="avis__carre avis__carre--partiel"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span></p>
        <p class="avis__note" data-texte="accueil.avis.note"></p>
        <p class="avis__nombre" data-texte="accueil.avis.nombre"></p>
        <p class="avis__logo" data-texte="accueil.avis.logo"></p>
      </div>
    </section>
    <div class="hero">
      <div class="conteneur hero__grille">
        <section class="hero__texte" data-bloc="E1-3" aria-labelledby="titre-hero">
          <h1 class="hero__titre" id="titre-hero" data-texte="accueil.hero.titre"></h1>
          <p class="hero__accroche" data-texte="accueil.hero.accroche"></p>
        </section>
        <section class="hero__recherche" data-bloc="E1-4">
          <form class="recherche carte" novalidate hidden>
            <label class="etiquette" id="etiquette-adresse" for="adresse" data-texte="accueil.recherche.libelle"></label>
            <div class="recherche__ligne">
              <input class="champ" type="text" id="adresse" name="adresse" autocomplete="street-address" aria-describedby="adresse-erreur adresse-microtexte" data-placeholder="accueil.recherche.placeholder">
              <button type="submit" class="bouton bouton--action" data-texte="accueil.recherche.bouton"></button>
            </div>
            <p class="recherche__erreur" id="adresse-erreur" aria-live="polite"></p>
            <p class="recherche__microtexte" id="adresse-microtexte" data-texte="accueil.recherche.microtexte"></p>
          </form>
        </section>
        <figure class="hero__visuel">
          <svg class="illustration" viewBox="0 0 480 360" role="img" aria-labelledby="illu-titre illu-desc" focusable="false">
            <title id="illu-titre" data-texte="accueil.hero.illustration.titre"></title>
            <desc id="illu-desc" data-texte="accueil.hero.illustration.description"></desc>
            <defs>
              <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="illu-hachure" x1="0" y1="0" x2="0" y2="8"/></pattern>
            </defs>
            <rect class="illu-eau" x="20" y="215" width="180" height="65"/>
            <path class="illu-trait" d="M20 215q15-6 30 0t30 0t30 0t30 0t30 0t30 0"/>
            <rect class="illu-trait illu-sol" x="20" y="280" width="440" height="60"/>
            <rect class="illu-hachure-remplissage" x="20" y="280" width="440" height="60"/>
            <rect class="illu-trait illu-dalle" x="260" y="268" width="200" height="12"/>
            <rect class="illu-trait illu-mur" x="200" y="30" width="260" height="12"/>
            <rect class="illu-trait illu-mur" x="200" y="42" width="60" height="108"/>
            <rect class="illu-trait illu-mur" x="200" y="268" width="60" height="12"/>
            <g class="illu-barriere">
              <rect x="184" y="170" width="14" height="37"/>
              <rect x="184" y="207" width="14" height="37"/>
              <rect x="184" y="244" width="14" height="36"/>
            </g>
            <path class="illu-cote" d="M60 170V280M56 178l4-8 4 8M56 272l4 8 4-8"/>
            <path class="illu-guide" d="M60 170H184"/>
            <path class="illu-cote" d="M110 215V280M106 223l4-8 4 8M106 272l4 8 4-8"/>
            <path class="illu-cote" d="M200 14H260M208 10l-8 4 8 4M252 10l8 4-8 4"/>
            <path class="illu-guide" d="M200 14V30M260 14V30"/>
            <path class="illu-cote" d="M320 150V268M316 158l4-8 4 8M316 260l4 8 4-8"/>
            <path class="illu-guide" d="M260 150H330M260 268H330"/>
          </svg>
          <figcaption class="hero__legende" data-texte="accueil.hero.illustration.legende"></figcaption>
        </figure>
      </div>
    </div>
  </main>
  <footer class="pied">
    <div class="conteneur">
      <p data-texte="site.pied.texte"></p>
    </div>
  </footer>
</body>
</html>
